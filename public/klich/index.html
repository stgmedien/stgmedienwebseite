<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Fahrschule Klich Gütersloh-Spexard – Führerschein &amp; BF17</title>
<link rel="icon" href="/klich/logo.png" type="image/png">
<style>
@font-face{font-family:"Barlow";src:url(/klich/barlow-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Barlow";src:url(/klich/barlow-600.woff2) format("woff2");font-weight:500 700;font-display:swap}
@font-face{font-family:"Barlow Condensed";src:url(/klich/barlowc-700.woff2) format("woff2");font-weight:600 800;font-display:swap}

body{margin:0;background:#F6F7F4}
a{color:#0072B5}a:hover{color:#005A8E}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #009FE3;outline-offset:2px;box-shadow:0 0 0 5px #14191F}
.k-nav{display:flex}
.k-sticky{display:none}
.k-sec{padding-block:clamp(48px,9vw,88px)}
@media (max-width:767px){
  .k-nav{display:none}
  .k-sticky{display:grid}
  .k-page{padding-bottom:76px}
}
h1,h2{hyphens:auto;overflow-wrap:break-word}

</style>
</head>
<body>
<div id="app"></div>
<script type="text/x-template" id="tpl">
<div style="background: #14191F; color: #FFFFFF; text-align: center; font-size: 14px; padding: 8px 16px; font-family: 'Barlow', sans-serif;">Vorschau für Markus Klich · Formulare senden noch nichts ab · Impressum und Datenschutz folgen</div>
<div class="k-page" style="background: #F6F7F4; color: #14191F; font-family: 'Barlow', 'Helvetica Neue', Helvetica, sans-serif; font-size: 17px; line-height: 1.55;">

<header style="background: #FFFFFF;">
<div style="max-width: 1200px; margin: 0 auto; padding: 10px 20px; min-height: 60px; box-sizing: border-box; display: flex; gap: 16px 32px; align-items: center; justify-content: space-between;">
<a href="#top" aria-label="Fahrschule Klich, zum Seitenanfang" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: #14191F;">
<img src="/klich/logo.png" alt="" width="64" height="65" style="display: block; width: 64px; height: auto;">
<span style="display: flex; flex-direction: column; line-height: 1.05;"><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 24px;">Fahrschule Klich</span><span style="font-size: 13px; font-weight: 500; color: #3A424A;">Gütersloh · Spexard · Isselhorst</span></span>
</a>
<nav class="k-nav" aria-label="Hauptnavigation" style="gap: 28px; font-weight: 500; font-size: 16px;">
<a href="#nervoes" style="color: #14191F; text-decoration: none;">So lernst du bei uns</a>
<a href="#eltern" style="color: #14191F; text-decoration: none;">Kosten &amp; Ablauf</a>
<a href="#standorte" style="color: #14191F; text-decoration: none;">Standorte</a>
</nav>
<a href="{{wa}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 8px; background: #25D366; color: #0E2A18; text-decoration: none; font-weight: 600; font-size: 16px;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.4A8.4 8.4 0 1 1 21 11.5z"></path></svg>WhatsApp</a>
</div>
<div aria-hidden="true" style="height: 4px; background: {{grad}};"></div>
</header>

<main>
<section id="top" style="max-width: 1200px; margin: 0 auto; padding: clamp(20px,4vw,56px) 20px clamp(32px,5vw,64px); display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: clamp(20px,4vw,48px); align-items: center;">
<div style="display: flex; flex-direction: column; gap: 14px;">
<p style="margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5B636B;">Fahrschule in Gütersloh-Spexard</p>
<sc-if value="{{isClaim}}" hint-placeholder-val="{{ true }}">
<h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: clamp(44px, 10vw, 100px); line-height: 0.95; letter-spacing: -0.005em;">Bei Klich macht’s <span style="background: {{gradSoft}}; background-size: 100% 34%; background-position: 0 88%; background-repeat: no-repeat; padding: 0 4px;">Klick.</span></h1>
<p style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: clamp(24px, 5.5vw, 38px); line-height: 1.1; color: {{accent}};">Weil du bei uns keine Nummer bist.</p>
</sc-if>
<sc-if value="{{isBF17}}" hint-placeholder-val="{{ false }}">
<h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: clamp(44px, 10vw, 100px); line-height: 0.95; letter-spacing: -0.005em;">Mit 17 selbst <span style="background: {{gradSoft}}; background-size: 100% 34%; background-position: 0 88%; background-repeat: no-repeat; padding: 0 4px;">am Steuer.</span></h1>
<p style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: clamp(24px, 5.5vw, 38px); line-height: 1.1; color: {{accent}};">Anmelden kannst du dich schon mit 16 ½.</p>
</sc-if>
<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 4px 20px; font-size: 16px; color: #3A424A;">
<li><a href="#bewertungen" style="color: #14191F; text-decoration: none;"><span aria-hidden="true" style="color: #C98A00;">★</span> <strong>4,7</strong> · 26 Google-Bewertungen</a></li>
<li><strong style="color: #14191F;">Seit über 50 Jahren</strong> in Gütersloh</li>
</ul>
</div>

<div id="anfrage" style="background: #FFFFFF; border: 1px solid #D5DAE0; border-radius: 16px; overflow: hidden; scroll-margin-top: 16px;">
<div class="k-form-photo" style="position: relative; aspect-ratio: 2.8 / 1; overflow: hidden; background: #DCE2E8; display: flex; align-items: flex-end;">
<img src="/klich/tesla.jpg" alt="Fahrlehrer der Fahrschule Klich am Tesla-Fahrschulwagen" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;">
<div style="position: relative; margin: 12px; padding: 8px 12px; background: #FFFFFF; border-radius: 999px; display: flex; gap: 10px; align-items: center; font-size: 14px; line-height: 1.2;">
<span aria-hidden="true" style="flex: none; width: 10px; height: 10px; border-radius: 50%; background: #25D366;"></span>
<span><strong>Philip oder Markus</strong> melden sich bei dir</span>
</div>
</div>
<div style="height: 4px; background: #E8EBEE;"><div style="height: 4px; width: {{progress}}; background: {{grad}}; transition: width .3s ease;"></div></div>
<div style="padding: clamp(18px,3vw,28px); display: flex; flex-direction: column; gap: 16px; min-height: 250px;">

<sc-if value="{{s1}}" hint-placeholder-val="{{ true }}">
<span style="font-size: 14px; font-weight: 600; color: #5B636B;">Frage 1 von 4 · dauert 30 Sekunden</span>
<h2 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 34px; line-height: 1.05;">Für wen ist der Führerschein?</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
<button type="button" onClick="{{pickSelf}}" style="{{tile}}"><span style="font-size: 20px;">Für mich</span><span style="font-size: 14px; font-weight: 400; color: #5B636B;">Ich bin der Fahrschüler</span></button>
<button type="button" onClick="{{pickKid}}" style="{{tile}}"><span style="font-size: 20px;">Für mein Kind</span><span style="font-size: 14px; font-weight: 400; color: #5B636B;">Ich bin Elternteil</span></button>
</div>
</sc-if>

<sc-if value="{{s2}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 14px; font-weight: 600; color: #5B636B;">Frage 2 von 4</span>
<h2 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 34px; line-height: 1.05;">Welcher Führerschein?</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
<button type="button" onClick="{{pickB}}" style="{{tile}}"><span style="font-size: 20px;">Auto</span><span style="font-size: 14px; font-weight: 400; color: #5B636B;">Klasse B</span></button>
<button type="button" onClick="{{pickBF17}}" style="{{tile}}"><span style="font-size: 20px;">Mit 17</span><span style="font-size: 14px; font-weight: 400; color: #5B636B;">BF17</span></button>
<button type="button" onClick="{{pickMoto}}" style="{{tile}}"><span style="font-size: 20px;">Motorrad</span><span style="font-size: 14px; font-weight: 400; color: #5B636B;">AM bis A</span></button>
<button type="button" onClick="{{pickOther}}" style="{{tile}}"><span style="font-size: 20px;">Etwas anderes</span><span style="font-size: 14px; font-weight: 400; color: #5B636B;">LKW, Anhänger …</span></button>
</div>
<button type="button" onClick="{{back}}" style="{{backBtn}}">← Zurück</button>
</sc-if>

<sc-if value="{{s3}}" hint-placeholder-val="{{ false }}">
<form onSubmit="{{nextName}}" style="display: flex; flex-direction: column; gap: 14px;">
<span style="font-size: 14px; font-weight: 600; color: #5B636B;">Frage 3 von 4</span>
<label for="f-name" style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 34px; line-height: 1.05;">{{nameQuestion}}</label>
<input id="f-name" name="name" type="text" autocomplete="name" required="" value="{{name}}" onChange="{{setName}}" placeholder="Vor- und Nachname" style="font: inherit; font-size: 20px; min-height: 56px; padding: 0 16px; border: 2px solid #7A838C; border-radius: 10px;">
<div style="display: flex; gap: 10px; align-items: center; justify-content: space-between;">
<button type="button" onClick="{{back}}" style="{{backBtn}}">← Zurück</button>
<button type="submit" style="min-height: 52px; padding: 0 28px; border: none; border-radius: 8px; background: {{accent}}; color: #FFFFFF; font: inherit; font-weight: 600; font-size: 18px; cursor: pointer;">Weiter →</button>
</div>
</form>
</sc-if>

<sc-if value="{{s4}}" hint-placeholder-val="{{ false }}">
<form onSubmit="{{submit}}" style="display: flex; flex-direction: column; gap: 14px;">
<span style="font-size: 14px; font-weight: 600; color: #5B636B;">Letzte Frage</span>
<label for="f-phone" style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 34px; line-height: 1.05;">{{phoneQuestion}}</label>
<input id="f-phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" required="" value="{{phone}}" onChange="{{setPhone}}" placeholder="0170 1234567" style="font: inherit; font-size: 20px; min-height: 56px; padding: 0 16px; border: 2px solid #7A838C; border-radius: 10px;">
<span style="font-size: 14px; color: #3A424A;">Wir schreiben dir per WhatsApp oder rufen kurz an, meist innerhalb von 24 Stunden.</span>
<div style="display: flex; gap: 10px; align-items: center; justify-content: space-between;">
<button type="button" onClick="{{back}}" style="{{backBtn}}">← Zurück</button>
<button type="submit" style="min-height: 52px; padding: 0 24px; border: none; border-radius: 8px; background: {{accent}}; color: #FFFFFF; font: inherit; font-weight: 600; font-size: 18px; cursor: pointer;">Unverbindlich anfragen</button>
</div>
<p style="margin: 0; font-size: 13px; color: #3A424A;">Deine Angaben nutzen wir nur, um uns bei dir zu melden. Mehr in der <a href="#">Datenschutzerklärung</a>.</p>
</form>
</sc-if>

<sc-if value="{{done}}" hint-placeholder-val="{{ false }}">
<div role="status" aria-live="polite" style="display: flex; flex-direction: column; gap: 12px;">
<span aria-hidden="true" style="width: 52px; height: 52px; border-radius: 50%; background: #E3F5EA; color: #1E7F4C; display: grid; place-items: center; font-size: 28px; font-weight: 700;">✓</span>
<h2 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 34px; line-height: 1.05;">Danke, {{firstName}}!</h2>
<p style="margin: 0; color: #3A424A;">Wir melden uns meist innerhalb von 24 Stunden. Schneller geht es, wenn du direkt schreibst:</p>
<a href="{{wa}}" style="align-self: flex-start; display: inline-flex; align-items: center; min-height: 48px; padding: 0 20px; border-radius: 8px; background: #25D366; color: #0E2A18; text-decoration: none; font-weight: 600;">WhatsApp öffnen</a>
<button type="button" onClick="{{restart}}" style="{{backBtn}}">Neue Anfrage starten</button>
</div>
</sc-if>

<sc-if value="{{showWa}}" hint-placeholder-val="{{ true }}">
<a href="{{wa}}" style="margin-top: auto; align-self: center; font-size: 15px; font-weight: 600; color: #14191F; min-height: 44px; display: inline-flex; align-items: center; gap: 8px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1E7F4C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.4A8.4 8.4 0 1 1 21 11.5z"></path></svg>Lieber direkt per WhatsApp schreiben</a>
</sc-if>
</div>
</div>
</section>

<section id="bewertungen" aria-labelledby="h-bew" style="background: #FFFFFF; border-block: 1px solid #E2E4E0;">
<div class="k-sec" style="max-width: 1200px; margin: 0 auto; padding-inline: 20px; display: flex; flex-direction: column; gap: 20px;">
<h2 id="h-bew" style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: clamp(32px, 5vw, 48px); line-height: 1.05;">Das sagen unsere Fahrschüler</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 14px; align-items: start;">
<figure style="margin: 0; border: 1px solid #E2E4E0; border-radius: 12px; padding: 22px; display: flex; flex-direction: column; gap: 10px;">
<span aria-label="5 von 5 Sternen" style="color: #C98A00; letter-spacing: 2px;">★★★★★</span>
<blockquote style="margin: 0; font-size: 17px;">„Am Donnerstag habe ich meine praktische Fahrprüfung endlich bestanden! Dank Philip wurde ich super vorbereitet und die Fahrstunden waren nicht nur informativ, sondern haben mir auch immer Spaß gemacht. Einerseits ist es ein tolles Gefühl nie wieder zur Fahrschule zu müssen aber andererseits werden mir die Fahrstunden mit Philip fehlen. Führerschein lernen muss nicht trocken sein – bei Klich wird gelacht, gelernt und gefahren!“</blockquote>
<figcaption style="font-size: 14px; color: #5B636B;">Jana K., Google-Bewertung</figcaption>
</figure>
<figure style="margin: 0; border: 1px solid #E2E4E0; border-radius: 12px; padding: 22px; display: flex; flex-direction: column; gap: 10px;">
<span aria-label="5 von 5 Sternen" style="color: #C98A00; letter-spacing: 2px;">★★★★★</span>
<blockquote style="margin: 0; font-size: 17px;">„Die Fahrschule ist echt top!! Die Lehrer sind total nett und erklären alles super verständlich. Würde ich jedem weiterempfehlen! Phillip du bist ein super Fahrlehrer, danke für deine Geduld und Motivation!“</blockquote>
<figcaption style="font-size: 14px; color: #5B636B;">Angelina B., Google-Bewertung</figcaption>
</figure>
<figure style="margin: 0; border: 1px solid #E2E4E0; border-radius: 12px; padding: 22px; display: flex; flex-direction: column; gap: 10px;">
<span aria-label="5 von 5 Sternen" style="color: #C98A00; letter-spacing: 2px;">★★★★★</span>
<blockquote style="margin: 0; font-size: 17px;">„Ich bin unglaublich zufrieden mit meiner Erfahrung bei Fahrschule Klich! Die Fahrlehrer sind extrem professionell, geduldig und erklären alles verständlich, egal ob in der Theorie oder während der Fahrstunden. Sie gehen auf die individuellen Bedürfnisse ein und sorgen dafür, dass man sich sicher und gut vorbereitet fühlt – nicht nur für die Prüfung, sondern auch für das Fahren im Alltag. Die Organisation war top, und ich habe mich immer gut betreut gefühlt. Die Fahrschule ist daher sehr empfehlenswert!“</blockquote>
<figcaption style="font-size: 14px; color: #5B636B;">Jonas H., Google-Bewertung</figcaption>
</figure>
</div>
<a href="https://www.google.com/maps/search/Fahrschule+Klich+Bruder-Konrad-Stra%C3%9Fe+59+G%C3%BCtersloh" style="align-self: flex-start; font-weight: 600; min-height: 44px; display: inline-flex; align-items: center;">Alle 26 Bewertungen auf Google ansehen</a>
</div>
</section>

<section id="nervoes" aria-labelledby="h-nerv">
<div class="k-sec" style="max-width: 1200px; margin: 0 auto; padding-inline: 20px; display: flex; flex-direction: column; gap: 28px;">
<div style="display: flex; flex-direction: column; gap: 10px; max-width: 720px;">
<h2 id="h-nerv" style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: clamp(40px, 7vw, 64px); line-height: 1;">Nervös? Völlig normal.</h2>
<p style="margin: 0; font-size: 19px; color: #3A424A;">So nehmen wir dir die Angst, bevor es auf die Straße geht.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 16px;">
<div style="background: #FFFFFF; border: 1px solid #E2E4E0; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 8px;">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="13" rx="2"></rect><path d="M8 21h8M12 17v4"></path></svg>
<h3 style="margin: 0; font-size: 22px; line-height: 1.2; font-weight: 600;">Erst im Simulator üben</h3>
<p style="margin: 0; color: #3A424A;">Anfahren, Lenken, Bremsen: Im Fahrsimulator probierst du alles in Ruhe aus, ohne echten Verkehr.</p>
</div>
<div style="background: #FFFFFF; border: 1px solid #E2E4E0; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 8px;">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
<h3 style="margin: 0; font-size: 22px; line-height: 1.2; font-weight: 600;">Ein Fahrlehrer, der deinen Stand kennt</h3>
<p style="margin: 0; color: #3A424A;">Du fängst nicht jede Stunde von vorn an. Wir wissen, was du schon kannst und woran ihr noch arbeitet.</p>
</div>
<div style="background: #FFFFFF; border: 1px solid #E2E4E0; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 8px;">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"></path></svg>
<h3 style="margin: 0; font-size: 22px; line-height: 1.2; font-weight: 600;">Lernen im Tesla</h3>
<p style="margin: 0; color: #3A424A;">Ohne Kupplung kannst du dich ganz auf den Verkehr konzentrieren. [Mit B197 darfst du danach trotzdem Schaltwagen fahren.]</p>
</div>
</div>
<a href="{{wa}}" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 22px; border-radius: 8px; border: 2px solid #14191F; color: #14191F; text-decoration: none; font-weight: 600;">Fragen? Schreib uns auf WhatsApp</a>
</div>
</section>

<section aria-labelledby="h-bf17" style="background: #14191F; color: #FFFFFF;">
<div class="k-sec" style="max-width: 1200px; margin: 0 auto; padding-inline: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 40px; align-items: center;">
<div style="display: flex; flex-direction: column; gap: 16px;">
<h2 id="h-bf17" style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: clamp(48px, 9vw, 92px); line-height: 0.95;">Nie wieder <span style="background: {{grad}}; -webkit-background-clip: text; background-clip: text; color: transparent;">Mama-Taxi.</span></h2>
<p style="margin: 0; font-size: 19px; color: #C9D0D6; max-width: 32em;">Mit BF17 fährst du ein Jahr früher selbst. Mama oder Papa sitzen dann als Beifahrer daneben, statt dich zu fahren. Ab 18 fährst du allein. Anmelden kannst du dich mit 16 ½.</p>
<a href="#anfrage" style="align-self: flex-start; display: inline-flex; align-items: center; min-height: 54px; padding: 0 26px; border-radius: 8px; background: {{grad}}; color: #0E1A12; text-decoration: none; font-weight: 600; font-size: 18px;">Ich will mit 17 fahren</a>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
<img src="/klich/b-tesla.jpg" alt="Fahrschülerin mit bestandener Prüfung vor dem Tesla der Fahrschule Klich" style="display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 12px;">
<img src="/klich/b-skoda.jpg" alt="Fahrschüler mit bestandener Prüfung vor einem Fahrschulwagen der Fahrschule Klich" style="display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 12px;">
<img src="/klich/b-motorrad.jpg" alt="Frisch bestandener Motorradführerschein auf dem Fahrschulmotorrad" style="display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 12px;">
<img src="/klich/b-traktor.jpg" alt="Bestandener Traktorführerschein mit Fahrlehrer vor dem Traktor" style="display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 12px;">
</div>
</div>
</section>

<section id="eltern" aria-labelledby="h-eltern">
<div class="k-sec" style="max-width: 1200px; margin: 0 auto; padding-inline: 20px; display: flex; flex-direction: column; gap: 32px;">
<div style="display: flex; flex-direction: column; gap: 10px; max-width: 760px;">
<p style="margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #5B636B;">Für Eltern</p>
<h2 id="h-eltern" style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: clamp(36px, 6vw, 56px); line-height: 1.02;">Was der Führerschein kostet und wie er abläuft</h2>
<p style="margin: 0; font-size: 18px; color: #3A424A;">Wir nennen Ihnen die Preise vorab und schätzen die Zahl der Fahrstunden ehrlich ein. Fragen klären Sie bequem per WhatsApp, auch abends.</p>
</div>

      setHours: (e) => this.setState({ hours: Number(e.target.value) }),
      toggleOwn: (e) => this.setState({ own: !!e.target.checked }),
      toggleBasics: (e) => this.setState({ haveBasics: !!e.target.checked }),
      accent,
      grad: 'linear-gradient(90deg, #009FE3 0%, #00A295 50%, #40A535 100%)',
      gradDeep: 'linear-gradient(110deg, #0072B5 0%, #00796E 55%, #2F7D32 100%)',
      gradSoft: 'linear-gradient(90deg, #BDE6F8 0%, #C9EBD0 50%, #D3ECC7 100%)',
      isClaim: hero !== 'BF17',
      isBF17: hero === 'BF17',
      wa: 'https://wa.me/491725383804?text=' + encodeURIComponent('Hallo Markus, ich interessiere mich für den Führerschein in Spexard.'),
      tile, backBtn,
      progress: pct,
      s1: st.step === 1, s2: st.step === 2, s3: st.step === 3, s4: st.step === 4, done: st.step === 5,
      showWa: st.step < 5,
      name: st.name, phone: st.phone,
      firstName: (st.name || '').trim().split(' ')[0] || 'dir',
      nameQuestion: kid ? 'Wie heißt Ihr Kind?' : 'Wie heißt du?',
      phoneQuestion: kid ? 'Unter welcher Nummer erreichen wir Sie?' : 'Unter welcher Nummer erreichen wir dich?',
      pickSelf: () => go({ who: 'self', step: 2 }),
      pickKid: () => go({ who: 'kid', step: 2 }),
      pickB: () => go({ klasse: 'B', step: 3 }),
      pickBF17: () => go({ klasse: 'BF17', step: 3 }),
      pickMoto: () => go({ klasse: 'Motorrad', step: 3 }),
      pickOther: () => go({ klasse: 'Andere', step: 3 }),
      setName: (e) => this.setState({ name: e.target.value }),
      setPhone: (e) => this.setState({ phone: e.target.value }),
      nextName: (e) => { e.preventDefault(); go({ step: 4 }); },
      submit: (e) => { e.preventDefault(); go({ step: 5 }); },
      back: () => go({ step: Math.max(1, st.step - 1) }),
      restart: () => go({ step: 1, who: '', klasse: '', name: '', phone: '' })
    };
  }
}

window.__mount(Component, {"hero": "Claim", "accent": "#0072B5"});
</script>
</body>
</html>
